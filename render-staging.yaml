services:
  - type: web
    name: untangled-nexus-api-staging
    runtime: python
    plan: starter
    rootDir: untangled-nexus-api-main
    branch: nexus-reliability-notifications
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_ENV
        value: staging
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: untangled_its_staging
      - key: FRONTEND_URL
        sync: false
      - key: DASHBOARD_CACHE_MS
        value: "5000"
      - key: SLOW_REQUEST_MS
        value: "750"
      - key: METRICS_TOKEN
        sync: false
